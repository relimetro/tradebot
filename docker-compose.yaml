version: "3.8"
services:
  trade-service:
    build: ./services/trade_service
    ports:
      - "50052:50052"
    networks:
      - backend
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  openresty:
    build: ./openresty
    ports:
      - 80:80
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      - backend

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ./services/dummy/dummy.pb:/services/dummy.pb
    ports:
      - "8080:8080"
    networks:
      - backend

  mongo: 
    image: mongo:6 
    ports: 
      - "27017:27017" 
    volumes: 
      - mongo-data:/data/db
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes: 
  mongo-data:
    driver: local
