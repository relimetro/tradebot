<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprint 1 – Investor Dashboard </title>
  <style>
    :root { --bg:#f7f7f8; --text:#111; --muted:#666; --card:#fff; --border:#e6e6ea; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; backdrop-filter:saturate(1.2) blur(6px); background: rgba(255,255,255,.7); border-bottom:1px solid var(--border); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }
    h1 { font-size: 22px; margin: 0; }
    .sub { font-size:12px; color:var(--muted); }

    .grid { display:grid; gap:16px; }
    @media (min-width: 900px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .kpi { display:flex; flex-direction:column; gap:6px; }
    .kpi .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .kpi .value { font-size:28px; font-weight:700; }

    .story { color:#222; font-size:14px; }
    .muted { color:var(--muted); font-size:12px; }

    .chart { width:100%; height:260px; }
    .chart-img { width:100%; height:auto; display:block; border:1px solid var(--border); border-radius:10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .caption { margin-top:8px; font-size:12px; color:var(--muted); }
    .chart .axis text { font-size:10px; fill:#555; }
    .chart .axis line, .chart .grid line { stroke:#ddd; }
    .chart .grid line { shape-rendering: crispEdges; }

    footer { text-align:center; color:var(--muted); font-size:12px; padding:30px 0; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
    .title { font-weight:600; }
  .dummy{display:none !important;}
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <h1>Investor Dashboard</h1>
      <div class="sub">test images</div>
    </div>
  </header>

  <main class="wrap grid" style="padding-top:18px;">
    <section class="card" style="background:#fcfcfd;">
      <div class="row"><div class="title">Sample Charts</div><div class="muted">test.</div></div>
    </section>

    <section class="grid grid-2">
      <div class="card">
        <div class="row"><div class="title">Model Predicted Return Over Time</div><div class="muted">PNG</div></div>
        <img class="chart-img" src="pred_return_over_time.png" alt="Model Predicted Return Over Time"
             onerror="imageMissing(this, 'pred_return_over_time.png')" />
      </div>
      <div class="card">
        <div class="row"><div class="title">Model Delta ETH Over Time</div><div class="muted">PNG</div></div>
        <img class="chart-img" src="delta_eth_over_time.png" alt="Model Delta ETH Over Time"
             onerror="imageMissing(this, 'delta_eth_over_time.png')" />
      </div>
    </section>

    <section class="grid grid-2">
      <div class="card">
        <div class="row"><div class="title">Buy & Hold vs Bot Portfolio Performance</div><div class="muted">PNG</div></div>
        <img class="chart-img" src="eh.png" alt="Buy & Hold vs Bot Portfolio Performance"
             onerror="imageMissing(this, 'eh.png')" />
      </div>
      <div class="card">
        <div class="row"><div class="title">Model % ETH Over Time</div><div class="muted">PNG</div></div>
        <img class="chart-img" src="p_eth_over_time.png" alt="Model % ETH Over Time"
             onerror="imageMissing(this, 'p_eth_over_time.png')" />
      </div>
    </section>
	<div id="pred"> </div>
	<div id="table-me"> </div>

    <footer>© Prototype • Agile Processes Group Project</footer>
  </main>

  <script>
    function imageMissing(imgEl, filename){
      console.warn('Image not found:', filename);
      const box = document.createElement('div');
      box.style.border = '1px dashed #e67';
      box.style.borderRadius = '10px';
      box.style.padding = '14px';
      box.style.background = '#fff7f7';
      box.style.color = '#a22';
      box.style.fontSize = '14px';
      box.innerHTML = `<b>Missing image:</b> <code>${filename}</code><br/>Put this file next to <code>index.html</code> or fix the path.`;
      imgEl.replaceWith(box);
    }
	const url = "http://localhost:80/"
	function backend_predictions(callback){
		fetch(url+"v1/GetPredictions", {
			method: 'POST',
			headers: {
				'Accept': 'application/json',
				'Content-Type': 'application/json',
			},
			body: ""
		})
			.then(response => response.json() )
			.then(data => { callback(data); })
			.catch((err)=>{  callback( {"data":[{"prediction": "0.00019626553694251925"}]} )  } )
	}
	function backend_features(callback){
		fetch(url+"v1/GetFeatures", {
			method: 'POST',
			headers: {
				'Accept': 'application/json',
				'Content-Type': 'application/json',
			},
			body: ""
		})
			.then(response => response.json() )
			.then(data => { callback(data); })
			.catch((err)=>{  callback( {"data":[{"High": "122.0", "Open": "122.0", "Close": "122.0", "avgTrueRange14": "0.1164285714285711", "momentum48h": "0.05719237435008662", "rollingReturnMean24": "0.0008176639306970527", "BBWidth": "0.03321660287783826", "ema24": "120.67064246663809", "MACD": "0.7480361482334672", "BBMiddle": "120.61100000000002" }, { "High": "122.0", "Open": "122.0", "Close": "122.0", "avgTrueRange14": "0.1164285714285711", "momentum48h": "0.02988350498058412", "rollingReturnMean24": "0.0008176639306970527", "BBWidth": "0.033019725593298944", "ema24": "120.77699106930704", "MACD": "0.7465607652961808", "BBMiddle": "120.74650000000001" } ]} )  })
	}

	function display_table(xs, divId){
		console.log(xs)
		if ( xs.length == 0 ) { return }
		k = Object.keys(xs[0]) // keys

		inner = ""
		inner = inner+"<table><tr>"
		// add header
		for (const x of k) {
			inner = inner+"<th>"+x+"</th>" }
		inner = inner+"</tr>"
		// add rows
		for (const x of xs){
			inner = inner+"<tr>"
			for (const y of k){
				inner = inner+"<td>"+x[y]+"</td>" }
			inner = inner+"</tr>"
		}

		inner = inner+"</table>"

		document.getElementById(divId).innerHTML = inner
	}

	backend_predictions( (x) => display_table(x.data,"pred") )
	backend_features( (x) => display_table(x.data,"table-me") )

  </script>
</body>
</html>
